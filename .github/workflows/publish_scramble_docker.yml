name: Publish Scramble Chatwoot image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/scramble-app/chatwoot
  BUILD_BASE_IMAGE_NAME: ghcr.io/scramble-app/chatwoot-build-base

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare dependency base tag
        id: deps
        shell: bash
        run: |
          deps_hash=$(sha256sum docker/Dockerfile.base Gemfile Gemfile.lock package.json pnpm-lock.yaml | sha256sum | cut -c1-16)
          base_image="${BUILD_BASE_IMAGE_NAME}:deps-${deps_hash}"

          echo "hash=${deps_hash}" >> "$GITHUB_OUTPUT"
          echo "image=${base_image}" >> "$GITHUB_OUTPUT"

      - name: Check dependency base image
        id: base
        shell: bash
        run: |
          if docker buildx imagetools inspect "${{ steps.deps.outputs.image }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push dependency base image
        if: steps.base.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.deps.outputs.image }}
            ${{ env.BUILD_BASE_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=build-base
          cache-to: type=gha,mode=max,scope=build-base

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          branch_tag=$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g' \
            | cut -c1-120)
          short_sha="${GITHUB_SHA::7}"

          {
            echo 'tags<<EOF'
            echo "${IMAGE_NAME}:${branch_tag}"
            echo "${IMAGE_NAME}:${short_sha}"
            if [ "${GITHUB_REF_NAME}" = "master" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_BASE_IMAGE=${{ steps.deps.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
