x-app-environment: &app_environment
  NODE_ENV: production
  RAILS_ENV: production
  INSTALLATION_ENV: docker
  ACTIVE_STORAGE_SERVICE: s3_compatible
  RACK_TIMEOUT_SERVICE_TIMEOUT: ${RACK_TIMEOUT_SERVICE_TIMEOUT:-90}
  POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set in .env}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatwoot_production}
  POSTGRES_USERNAME: ${POSTGRES_USERNAME:?POSTGRES_USERNAME must be set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
  PGSSLMODE: ${PGSSLMODE:-require}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID must be set in .env}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY must be set in .env}
  STORAGE_REGION: ${STORAGE_REGION:?STORAGE_REGION must be set in .env}
  STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:?STORAGE_BUCKET_NAME must be set in .env}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT must be set in .env}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}

x-app-base: &app_base
  image: ghcr.io/scramble-app/chatwoot:${CHATWOOT_IMAGE_TAG:-latest}
  env_file: .env

services:
  nginx:
    image: nginx:alpine
    depends_on:
      - rails
      - certbot
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:?CERTBOT_DOMAIN must be set in .env}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-40M}
    ports:
      - '443:443'
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        certificate_path="/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/fullchain.pem"
        private_key_path="/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/privkey.pem"

        until [ -f "$${certificate_path}" ] && [ -f "$${private_key_path}" ]; do
          echo "Waiting for certificate for $${CERTBOT_DOMAIN}..."
          sleep 5
        done

        while :; do
          sleep 12h
          nginx -s reload
        done &

        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    restart: always

  rails:
    <<: *app_base
    depends_on:
      - redis
    environment:
      <<: *app_environment
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *app_base
    depends_on:
      - redis
    environment:
      <<: *app_environment
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  certbot:
    image: certbot/dns-cloudflare:latest
    env_file: .env
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:?CERTBOT_DOMAIN must be set in .env}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?CERTBOT_EMAIL must be set in .env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be set in .env}
    volumes:
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        credentials_path="/tmp/cloudflare.ini"
        printf 'dns_cloudflare_api_token = %s\n' "$${CLOUDFLARE_API_TOKEN}" > "$${credentials_path}"
        chmod 600 "$${credentials_path}"

        if [ ! -f "/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/fullchain.pem" ]; then
          certbot certonly \
            --dns-cloudflare \
            --dns-cloudflare-credentials "$${credentials_path}" \
            --non-interactive \
            --agree-tos \
            --email "$${CERTBOT_EMAIL}" \
            -d "$${CERTBOT_DOMAIN}"
        fi

        trap exit TERM
        while :; do
          certbot renew \
            --dns-cloudflare \
            --dns-cloudflare-credentials "$${credentials_path}" \
            --quiet
          sleep 12h & wait $${!}
        done
    restart: always

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  letsencrypt:
  redis_data:
