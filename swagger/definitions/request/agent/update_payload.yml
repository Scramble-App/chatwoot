type: object
required:
  - role
properties:
  role:
    type: string
    enum: ['agent', 'administrator']
    description: Whether its administrator or agent
    example: 'agent'
  availability_status:
    type: string
    enum: ['available', 'busy', 'offline']
    description: The availability status of the agent.
    example: 'available'
  auto_offline:
    type: boolean
    description: Whether the availability status of agent is configured to go offline automatically when away.
    example: true
  translation_locale:
    type:
      - string
      - 'null'
    description: Locale used for operator-only incoming message translations.
    example: 'en'
  schedule_enabled:
    type: boolean
    description: Whether the agent schedule controls availability.
    example: false
  schedule_timezone:
    type: string
    description: Timezone used to evaluate the agent schedule.
    example: UTC
  working_hours:
    type: array
    description: Weekly schedule intervals for the agent.
    items:
      type: object
  schedule_exceptions:
    type: array
    description: One-off schedule exceptions for the agent.
    items:
      type: object
