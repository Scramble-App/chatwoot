type: object
properties:
  id:
    type: integer
  account_id:
    type: integer
  availability_status:
    type: string
    enum: ['available', 'busy', 'offline']
    description: The availability status of the agent computed by Chatwoot.
  auto_offline:
    type: boolean
    description: Whether the availability status of agent is configured to go offline automatically when away.
  availability_source:
    type: string
    enum: ['manual', 'schedule']
    description: Whether availability is controlled manually or by the agent schedule.
  schedule_enabled:
    type: boolean
    description: Whether the agent schedule controls availability.
  schedule_timezone:
    type: string
    description: Timezone used to evaluate the agent schedule.
  confirmed:
    type: boolean
    description: Whether the agent has confirmed their email address.
  email:
    type: string
    description: The email of the agent
  available_name:
    type: string
    description: The available name of the agent
  name:
    type: string
    description: The name of the agent
  role:
    type: string
    enum: ['agent', 'administrator']
    description: The role of the agent
  translation_locale:
    type:
      - string
      - 'null'
    description: Locale used for operator-only incoming message translations.
  working_hours:
    type: array
    description: Weekly schedule intervals for the agent.
    items:
      type: object
  schedule_exceptions:
    type: array
    description: One-off schedule exceptions for the agent.
    items:
      type: object
  thumbnail:
    type: string
    description: The thumbnail of the agent
  custom_role_id:
    type:
      - integer
      - 'null'
    description: The custom role id of the agent
